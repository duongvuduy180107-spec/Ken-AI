<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Multi Chat + Translate — Groq + Google Script</title>
  <style>
    :root{
      --bg1:#03101a;
      --bg2:#071020;
      --panel:rgba(11,18,32,0.92);
      --panel2:rgba(255,255,255,0.04);
      --line:rgba(255,255,255,0.06);
      --text:#e6eef8;
      --muted:#9aa6b6;
      --accent:#7dd3fc;
      --accent2:#06343b;
      --danger:#fb7185;
      --shadow:0 10px 40px rgba(2,6,23,0.6);
      --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow:hidden;
    }
    button,select,input{font:inherit}
    .app{
      height:100vh;
      display:flex;
      gap:0;
    }

    .sidebar{
      width:300px;
      min-width:300px;
      background:rgba(4,10,18,0.72);
      border-right:1px solid var(--line);
      display:flex;
      flex-direction:column;
      padding:14px;
      gap:12px;
      backdrop-filter: blur(10px);
    }
    .sidebar-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .brand h1{
      margin:0;
      font-size:18px;
      line-height:1.1;
    }
    .brand .sub{
      color:var(--muted);
      font-size:12px;
    }
    .new-chat-btn{
      border:none;
      background:var(--accent);
      color:#042028;
      font-weight:700;
      border-radius:12px;
      padding:10px 12px;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 8px 20px rgba(125,211,252,0.12);
    }
    .chat-list{
      overflow:auto;
      padding-right:2px;
      display:flex;
      flex-direction:column;
      gap:8px;
      flex:1;
    }
    .chat-item{
      width:100%;
      text-align:left;
      border:1px solid var(--line);
      background:rgba(255,255,255,0.03);
      color:var(--text);
      border-radius:14px;
      padding:12px 12px 10px;
      cursor:pointer;
      display:flex;
      align-items:flex-start;
      gap:10px;
      justify-content:space-between;
      transition:transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .chat-item:hover{transform:translateY(-1px);background:rgba(255,255,255,0.05)}
    .chat-item.active{
      border-color:rgba(125,211,252,0.45);
      background:rgba(125,211,252,0.10);
    }
    .chat-item .info{
      min-width:0;
      flex:1;
    }
    .chat-item .title{
      font-size:14px;
      font-weight:700;
      margin-bottom:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .chat-item .meta{
      font-size:11px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .del-chat-btn{
      border:none;
      background:transparent;
      color:#ffd2db;
      cursor:pointer;
      border-radius:10px;
      width:32px;
      height:32px;
      flex:0 0 auto;
    }
    .del-chat-btn:hover{background:rgba(251,113,133,0.14)}
    .sidebar-foot{
      border-top:1px solid var(--line);
      padding-top:10px;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }

    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      min-width:0;
      position:relative;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      background:rgba(6,10,16,0.40);
      backdrop-filter: blur(10px);
    }
    .topbar-left{
      min-width:0;
      display:flex;
      align-items:flex-start;
      gap:10px;
    }
    .mobile-menu-btn{
      display:none;
      border:none;
      background:rgba(255,255,255,0.06);
      color:var(--text);
      width:40px;
      height:40px;
      border-radius:12px;
      cursor:pointer;
    }
    .chat-head{
      min-width:0;
    }
    .chat-head h2{
      margin:0;
      font-size:17px;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .chat-head .tiny{
      color:var(--muted);
      font-size:12px;
      margin-top:3px;
    }
    .topbar-right{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      padding:8px 10px;
      border-radius:999px;
      background:rgba(255,255,255,0.04);
      color:#d7e4f1;
      font-size:13px;
      border:1px solid rgba(255,255,255,0.04);
    }
    select.pill{
      appearance:none;
      outline:none;
      color:#d7e4f1;
      background:rgba(255,255,255,0.04);
    }
    .toggle-group{
      display:flex;
      align-items:center;
      gap:6px;
      padding:0 4px;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
    }
    .toggle-group input{transform:scale(1.08)}
    .danger-btn{
      border:none;
      background:var(--danger);
      color:#25060d;
      font-weight:700;
      border-radius:12px;
      padding:9px 12px;
      cursor:pointer;
      white-space:nowrap;
    }

    .messages-wrap{
      flex:1;
      overflow:auto;
      padding:18px 18px 120px;
      scroll-behavior:smooth;
    }
    .messages{
      display:flex;
      flex-direction:column;
      gap:12px;
      max-width:980px;
      margin:0 auto;
    }
    .msg{
      max-width:86%;
      padding:12px;
      border-radius:14px;
      line-height:1.5;
      white-space:pre-wrap;
      word-break:break-word;
      box-shadow:0 6px 16px rgba(2,6,23,0.45);
    }
    .user{
      align-self:flex-end;
      background:linear-gradient(180deg,#0b1520 0%, #071827 100%);
      text-align:right;
      color:#cfeefc;
    }
    .assistant{
      align-self:flex-start;
      background:linear-gradient(180deg,#06343b 0%, #052d31 100%);
      color:#e6f7fb;
    }
    .msg-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:8px;
    }
    .meta-msg{
      font-size:12px;
      color:var(--muted);
    }
    .voice-btn{
      border:none;
      background:rgba(255,255,255,0.08);
      color:#e6f7fb;
      width:34px;
      height:34px;
      border-radius:10px;
      cursor:pointer;
      flex:0 0 auto;
    }
    .voice-btn:hover{background:rgba(255,255,255,0.14)}
    .translated{
      margin-top:8px;
      font-size:13px;
      color:#cfeefc;
      opacity:0.95;
    }
    .romanji{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
    }

    .composer-wrap{
      position:fixed;
      left:300px;
      right:0;
      bottom:env(safe-area-inset-bottom,12px);
      display:flex;
      justify-content:center;
      padding:12px;
      background:linear-gradient(180deg,rgba(3,8,14,0),rgba(3,8,14,0.96));
      pointer-events:auto;
    }
    .composer{
      width:100%;
      max-width:980px;
      display:flex;
      gap:8px;
      align-items:flex-end;
    }
    .input-box{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .row-input{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .input-wrap{
      flex:1;
      display:flex;
      gap:8px;
      align-items:center;
      background:rgba(255,255,255,0.03);
      padding:8px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.04);
    }
    input[type=text]{
      flex:1;
      border:none;
      outline:none;
      background:transparent;
      color:inherit;
      padding:8px;
      font-size:15px;
    }
    .send-btn{
      background:var(--accent);
      color:#042028;
      border:none;
      padding:10px 14px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }
    .send-btn:disabled{opacity:.6;cursor:not-allowed}

    .typing{display:inline-block}
    .dots span{
      display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;
      background:#cfeefc;opacity:0.3;animation:blink 1s infinite
    }
    @keyframes blink{
      0%{opacity:.2;transform:translateY(0)}
      50%{opacity:1;transform:translateY(-4px)}
      100%{opacity:.2;transform:translateY(0)}
    }
    .toast{
      position:fixed;
      right:18px;
      bottom:110px;
      background:rgba(0,0,0,0.72);
      padding:10px 14px;
      border-radius:8px;
      color:#e6eef8;
      z-index:60;
      max-width:min(92vw,360px)
    }

    @media(max-width:900px){
      .sidebar{
        position:fixed;
        z-index:50;
        left:0;
        top:0;
        bottom:0;
        transform:translateX(-102%);
        transition:transform .18s ease;
        box-shadow:var(--shadow);
      }
      .sidebar.open{transform:translateX(0)}
      .mobile-menu-btn{display:inline-flex;align-items:center;justify-content:center}
      .composer-wrap{left:0}
    }
    @media(max-width:720px){
      .topbar{padding:14px 12px}
      .messages-wrap{padding:14px 12px 120px}
      .msg{max-width:92%}
      .danger-btn{padding:9px 10px}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <h1>Ken AI</h1>
          <div class="sub">Nhiều chat độc lập</div>
        </div>
        <button id="newChatBtn" class="new-chat-btn" type="button">+ Chat mới</button>
      </div>

      <div id="chatList" class="chat-list" aria-label="Danh sách chat"></div>

      <div class="sidebar-foot">
        Mỗi chat lưu riêng trong máy này.<br/>
        Xóa từng chat bằng nút thùng rác.
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button id="mobileMenuBtn" class="mobile-menu-btn" type="button" aria-label="Mở menu">☰</button>
          <div class="chat-head">
            <h2 id="activeChatTitle">Chat</h2>
            <div id="activeChatSub" class="tiny">Sẵn sàng</div>
          </div>
        </div>

        <div class="topbar-right">
          <select id="model" class="pill" title="Chọn model">
            <option value="llama-3.3-70b-versatile">Llama 3.3 70B Versatile</option>
            <option value="llama-3.1-8b-instant">Llama 3.1 8B Instant</option>
            <option value="qwen-2.5-32b">Qwen 2.5 32B</option>
            <option value="gemma2-9b-it">Gemma 2 9B IT</option>
          </select>

          <div class="toggle-group">
            <span>Force JP</span>
            <input id="forceJP" type="checkbox" />
          </div>

          <div class="toggle-group">
            <span>Auto dịch</span>
            <input id="autoTranslate" type="checkbox" checked />
          </div>

          <div id="dailyInfo" class="pill">Lượt hôm nay: 0/50</div>
          <button id="deleteChatBtn" class="danger-btn" type="button">Xóa chat này</button>
        </div>
      </div>

      <div id="messagesWrap" class="messages-wrap">
        <div id="messages" class="messages" aria-live="polite"></div>
      </div>
    </main>
  </div>

  <div class="composer-wrap">
    <div class="composer" role="region" aria-label="Thanh nhập">
      <div class="input-box">
        <div class="row-input">
          <div class="input-wrap">
            <input id="textInput" type="text" placeholder="Gõ tin nhắn... (Enter gửi)" autocomplete="off" />
          </div>
          <button id="sendBtn" class="send-btn">Gửi</button>
        </div>

        <div style="display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap">
          <div class="small compact">Web thực hiện bởi Shirogane Ken sử dụng công nghệ API của Groq và Google App Script do chính tôi code nhằm hỗ trợ dịch
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';

  const CONFIG = {
    groqApiKey: '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',
    translateScriptUrl: 'https://script.google.com/macros/s/AKfycbzAICigheXKYUsTbz40wBvBZoO7e1QwpnshdmXNKssfruroT7ATW6-kKr3fL-cDH7GG/exec',
    dailyLimit: 50,
    storagePrefix: 'multi_chat_translate_groq_v1_',
    modelDefault: 'llama-3.3-70b-versatile',
    endpoint: 'https://api.groq.com/openai/v1/chat/completions'
  };

  const $ = (id) => document.getElementById(id);
  const sidebar = $('sidebar');
  const mobileMenuBtn = $('mobileMenuBtn');
  const chatListEl = $('chatList');
  const activeChatTitleEl = $('activeChatTitle');
  const activeChatSubEl = $('activeChatSub');
  const modelEl = $('model');
  const messagesEl = $('messages');
  const messagesWrap = $('messagesWrap');
  const textInput = $('textInput');
  const sendBtn = $('sendBtn');
  const newChatBtn = $('newChatBtn');
  const deleteChatBtn = $('deleteChatBtn');
  const forceJpCheckbox = $('forceJP');
  const autoTranslateCheckbox = $('autoTranslate');
  const dailyInfo = $('dailyInfo');

  const STORAGE_THREADS = CONFIG.storagePrefix + 'threads';
  const STORAGE_ACTIVE = CONFIG.storagePrefix + 'active';
  const STORAGE_MODEL = CONFIG.storagePrefix + 'model';
  const STORAGE_DAILY = CONFIG.storagePrefix + 'daily';

  let threads = safeParse(localStorage.getItem(STORAGE_THREADS), []);
  let activeThreadId = localStorage.getItem(STORAGE_ACTIVE);
  let dailyState = safeParse(localStorage.getItem(STORAGE_DAILY), {});

  initDaily();
  initThreads();
  initModel();
  updateDailyUi();
  renderAll();

  modelEl.addEventListener('change', () => {
    localStorage.setItem(STORAGE_MODEL, modelEl.value);
  });

  newChatBtn.addEventListener('click', () => {
    const t = createThread();
    setActiveThread(t.id);
    showToast('Đã tạo chat mới');
  });

  deleteChatBtn.addEventListener('click', () => {
    const thread = getActiveThread();
    if (!thread) return;
    const ok = confirm(`Xóa chat "${thread.title}"?`);
    if (!ok) return;
    deleteThread(thread.id);
  });

  mobileMenuBtn.addEventListener('click', () => {
    sidebar.classList.toggle('open');
  });

  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      onSend();
    }
  });

  sendBtn.addEventListener('click', onSend);

  function safeParse(val, fallback) {
    try { return val ? JSON.parse(val) : fallback; } catch { return fallback; }
  }

  function saveThreads() {
    localStorage.setItem(STORAGE_THREADS, JSON.stringify(threads));
  }

  function saveActive() {
    localStorage.setItem(STORAGE_ACTIVE, activeThreadId || '');
  }

  function saveDaily() {
    localStorage.setItem(STORAGE_DAILY, JSON.stringify(dailyState));
  }

  function initDaily() {
    const today = new Date().toISOString().slice(0, 10);
    if (!dailyState.date || dailyState.date !== today) {
      dailyState = { date: today, used: 0 };
      saveDaily();
    }
  }

  function initThreads() {
    if (!Array.isArray(threads) || !threads.length) {
      const t = createThread(true);
      activeThreadId = t.id;
      saveActive();
    } else {
      const exists = threads.some(t => t.id === activeThreadId);
      if (!exists) {
        activeThreadId = threads[0].id;
        saveActive();
      }
    }
  }

  function initModel() {
    const savedModel = localStorage.getItem(STORAGE_MODEL);
    modelEl.value = savedModel || CONFIG.modelDefault;
  }

  function uid() {
    return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function nowLabel() {
    return new Date().toLocaleString('vi-VN', {
      hour: '2-digit',
      minute: '2-digit',
      day: '2-digit',
      month: '2-digit'
    });
  }

  function createThread(isInitial = false) {
    const thread = {
      id: uid(),
      title: isInitial ? 'Chat mới' : 'Chat mới',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      messages: []
    };
    threads.unshift(thread);
    saveThreads();
    renderSidebar();
    return thread;
  }

  function deleteThread(id) {
    threads = threads.filter(t => t.id !== id);
    if (!threads.length) {
      const t = createThread(true);
      activeThreadId = t.id;
    } else if (activeThreadId === id) {
      activeThreadId = threads[0].id;
    }
    saveThreads();
    saveActive();
    renderAll();
    showToast('Đã xóa chat');
  }

  function setActiveThread(id) {
    activeThreadId = id;
    saveActive();
    renderAll();
    if (window.innerWidth <= 900) {
      sidebar.classList.remove('open');
    }
  }

  function getActiveThread() {
    return threads.find(t => t.id === activeThreadId) || threads[0] || null;
  }

  function updateThreadTitle(thread) {
    const firstUser = thread.messages.find(m => m.role === 'user');
    if (!firstUser) return;
    const text = String(firstUser.content || '').trim();
    if (!text) return;
    const base = text.replace(/\s+/g, ' ');
    thread.title = base.length > 24 ? base.slice(0, 24) + '…' : base;
  }

  function updateThreadMeta(thread) {
    thread.updatedAt = new Date().toISOString();
    updateThreadTitle(thread);
  }

  function detectInputLanguage(text) {
    const raw = String(text || '').trim();
    if (!raw) return 'unknown';

    // Ưu tiên tiếng Việt trước: chỉ cần có 1 dấu hiệu tiếng Việt là coi là tiếng Việt
    const hasVietnameseDiacritics = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(raw);
    const viWordHints = [
      'xin', 'chào', 'chao', 'bạn', 'ban', 'tôi', 'toi', 'mình', 'minh',
      'hôm', 'hom', 'nay', 'qua', 'cảm', 'cam', 'ơn', 'on', 'không', 'khong',
      'có', 'co', 'giúp', 'giup', 'thế', 'the', 'nào', 'sao', 'được', 'duoc',
      'làm', 'lam', 'nha', 'nhé', 'nhe', 'rồi', 'roi', 'vì', 'vi', 'nên', 'nen',
      'đang', 'dang', 'đi', 'di', 'gì', 'gi', 'đâu', 'dau', 'đó', 'do'
    ];

    if (hasVietnameseDiacritics) return 'vi';

    const lowered = raw.toLowerCase();
    for (const w of viWordHints) {
      const re = new RegExp(`(^|[^\\p{L}])${escapeRegex(w)}([^\\p{L}]|$)`, 'iu');
      if (re.test(lowered)) return 'vi';
    }

    if (/[ぁ-んァ-ン一-龯々]/.test(raw)) return 'ja';

    return 'ja';
  }

  function escapeRegex(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function buildSystemPrompt(mode, forceJP) {
    if (mode === 'vi') {
      return 'Bạn là trợ lý hữu ích. Hãy trả lời hoàn toàn bằng tiếng Việt tự nhiên, không dịch sang ngôn ngữ khác, không Romanji, không nhắc rằng bạn là AI.';
    }
    if (forceJP) {
      return 'You are a native Japanese speaker. Reply in Japanese only. Keep the response natural and concise. Do not say you are an AI.';
    }
    return 'Reply in Japanese only. Keep the response natural and concise. Do not say you are an AI.';
  }

  function buildMessages(userText, mode, forceJP, thread) {
    const msgs = [
      { role: 'system', content: buildSystemPrompt(mode, forceJP) }
    ];

    for (const m of thread.messages) {
      if (m.role === 'user' || m.role === 'assistant') {
        msgs.push({ role: m.role, content: m.content || '' });
      }
    }

    msgs.push({ role: 'user', content: userText });
    return msgs;
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;');
  }

  function updateDailyUi() {
    dailyInfo.innerText = `Lượt hôm nay: ${Number(dailyState.used || 0)}/${CONFIG.dailyLimit}`;
  }

  function incrementDailyCount() {
    dailyState.used = Number(dailyState.used || 0) + 1;
    saveDaily();
    updateDailyUi();
  }

  function decrementDailyCount() {
    dailyState.used = Math.max(0, Number(dailyState.used || 0) - 1);
    saveDaily();
    updateDailyUi();
  }

  function hasDailyQuota() {
    return Number(dailyState.used || 0) < CONFIG.dailyLimit;
  }

  function showToast(msg, ms = 1800) {
    let el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.innerText = msg;
    el.style.display = 'block';
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => (el.style.display = 'none'), ms);
  }

  function showTyping() {
    const node = document.createElement('div');
    node.className = 'msg assistant';
    node.id = 'typingNode';
    node.innerHTML = '<div class="meta-msg">AI đang soạn...</div><div class="typing dots"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(node);
    messagesWrap.scrollTop = messagesWrap.scrollHeight;
  }

  function removeTyping() {
    const node = $('typingNode');
    if (node) node.remove();
  }

  function parseResponse(data) {
    if (!data) return '(No data)';
    if (typeof data === 'string') return data;
    if (data.choices?.[0]?.message?.content) return data.choices[0].message.content;
    if (data.error?.message) return data.error.message;
    if (data.message) return data.message;
    return JSON.stringify(data, null, 2);
  }

  async function callGroq(apiKey, body) {
    const res = await fetch(CONFIG.endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify(body)
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }
    return { ok: res.ok, status: res.status, data };
  }

  async function translateViaScript(text, source = 'ja', target = 'vi') {
    const scriptUrl = (CONFIG.translateScriptUrl || '').trim();
    if (!scriptUrl || scriptUrl.includes('PASTE_')) {
      return { error: 'Translate script URL chưa được cấu hình' };
    }

    const url = scriptUrl + '?text=' + encodeURIComponent(text) +
      '&source=' + encodeURIComponent(source) +
      '&target=' + encodeURIComponent(target);

    const res = await fetch(url, { method: 'GET' });
    if (!res.ok) return { error: 'Translate script returned ' + res.status };
    return await res.json();
  }

  function isJapaneseText(text) {
    return /[ぁ-んァ-ン一-龯々]/.test(String(text || ''));
  }

  function speakJapanese(text) {
    if (!('speechSynthesis' in window)) {
      showToast('Trình duyệt không hỗ trợ phát âm');
      return;
    }

    const raw = String(text || '').trim();
    if (!raw) return;

    speechSynthesis.cancel();

    const utter = new SpeechSynthesisUtterance(raw);
    utter.lang = 'ja-JP';
    utter.rate = 0.95;
    utter.pitch = 1;

    const voices = speechSynthesis.getVoices?.() || [];
    const jpVoice =
      voices.find(v => /ja/i.test(v.lang)) ||
      voices.find(v => /Japanese/i.test(v.name)) ||
      null;

    if (jpVoice) utter.voice = jpVoice;

    speechSynthesis.speak(utter);
  }

  function renderSidebar() {
    chatListEl.innerHTML = '';
    const sorted = [...threads].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

    sorted.forEach(thread => {
      const item = document.createElement('button');
      item.className = 'chat-item' + (thread.id === activeThreadId ? ' active' : '');
      item.type = 'button';

      const info = document.createElement('div');
      info.className = 'info';

      const title = document.createElement('div');
      title.className = 'title';
      title.innerText = thread.title || 'Chat';

      const meta = document.createElement('div');
      meta.className = 'meta';
      const last = thread.messages.at(-1);
      meta.innerText = last ? (last.content || '').slice(0, 42) : 'Chưa có tin nhắn';

      info.appendChild(title);
      info.appendChild(meta);

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del-chat-btn';
      del.title = 'Xóa chat này';
      del.innerText = '🗑';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        const ok = confirm(`Xóa chat "${thread.title}"?`);
        if (!ok) return;
        deleteThread(thread.id);
      });

      item.appendChild(info);
      item.appendChild(del);

      item.addEventListener('click', () => setActiveThread(thread.id));

      chatListEl.appendChild(item);
    });
  }

  function renderMessages() {
    const thread = getActiveThread();
    messagesEl.innerHTML = '';

    if (!thread) {
      activeChatTitleEl.innerText = 'Chat';
      activeChatSubEl.innerText = 'Chưa có chat';
      return;
    }

    activeChatTitleEl.innerText = thread.title || 'Chat';
    activeChatSubEl.innerText = `${thread.messages.length} tin nhắn · ${nowLabel()}`;

    thread.messages.forEach(msg => {
      const el = document.createElement('div');
      el.className = 'msg ' + (msg.role === 'user' ? 'user' : 'assistant');

      if (msg.role === 'assistant') {
        const top = document.createElement('div');
        top.className = 'msg-top';

        if (msg.meta) {
          const meta = document.createElement('div');
          meta.className = 'meta-msg';
          meta.innerText = msg.meta;
          top.appendChild(meta);
        } else {
          const spacer = document.createElement('div');
          spacer.style.minHeight = '1px';
          top.appendChild(spacer);
        }

        if (msg.voiceable) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'voice-btn';
          btn.title = 'Phát âm tiếng Nhật';
          btn.innerText = '🔊';
          btn.addEventListener('click', () => speakJapanese(msg.content || ''));
          top.appendChild(btn);
        }

        el.appendChild(top);
      }

      const c = document.createElement('div');
      c.innerText = msg.content || '';
      el.appendChild(c);

      if (msg.translation) {
        const t = document.createElement('div');
        t.className = 'translated';
        t.innerHTML = '<strong>→ VI:</strong> ' + escapeHtml(msg.translation);
        el.appendChild(t);
      }

      if (msg.romanji) {
        const r = document.createElement('div');
        r.className = 'romanji';
        r.innerText = '→ Romanji: ' + msg.romanji;
        el.appendChild(r);
      }

      messagesEl.appendChild(el);
    });

    messagesWrap.scrollTop = messagesWrap.scrollHeight;
  }

  function renderAll() {
    renderSidebar();
    renderMessages();
  }

  async function onSend() {
    if (!hasDailyQuota()) {
      alert('Bạn đã hết lượt nhắn trong ngày. Vui lòng thử lại vào ngày mai 🙏');
      return;
    }

    const text = (textInput.value || '').trim();
    if (!text) {
      alert('Nhập tin nhắn đi đã');
      return;
    }

    const thread = getActiveThread();
    if (!thread) {
      const t = createThread(true);
      setActiveThread(t.id);
      return;
    }

    const inputMode = detectInputLanguage(text);
    const userMsg = { role: 'user', content: text };
    thread.messages.push(userMsg);
    updateThreadMeta(thread);
    saveThreads();
    renderAll();

    textInput.value = '';

    const apiKey = (CONFIG.groqApiKey || '').trim();
    if (!apiKey || apiKey.includes('PASTE_')) {
      alert('Chưa dán GROQ API key vào CONFIG.groqApiKey');
      thread.messages.pop();
      saveThreads();
      renderAll();
      return;
    }

    incrementDailyCount();
    showTyping();
    sendBtn.disabled = true;

    try {
      const forceJP = forceJpCheckbox.checked && inputMode !== 'vi';

      const body = {
        model: modelEl.value || CONFIG.modelDefault,
        messages: buildMessages(text, inputMode, forceJP, thread),
        temperature: 0.7
      };

      const response = await callGroq(apiKey, body);

      if (response.status === 429) {
        dailyState.used = Math.max(0, Number(dailyState.used || 1) - 1);
        saveDaily();
        updateDailyUi();
        removeTyping();
        thread.messages.push({
          role: 'assistant',
          content: 'Bạn đã hết lượt gửi theo giới hạn server (429). Thử lại sau nhé.',
          voiceable: false
        });
        updateThreadMeta(thread);
        saveThreads();
        renderAll();
        return;
      }

      if (!response.ok) {
        removeTyping();
        thread.messages.push({
          role: 'assistant',
          content: 'Lỗi từ API: ' + (typeof response.data === 'string' ? response.data : JSON.stringify(response.data)),
          voiceable: false
        });
        updateThreadMeta(thread);
        saveThreads();
        renderAll();
        decrementDailyCount();
        return;
      }

      const assistantText = parseResponse(response.data);

      let translated = null;
      let romanji = null;

      const shouldTranslate = autoTranslateCheckbox.checked && inputMode !== 'vi';
      if (shouldTranslate && CONFIG.translateScriptUrl && !CONFIG.translateScriptUrl.includes('PASTE_')) {
        try {
          const t = await translateViaScript(assistantText, 'ja', 'vi');
          if (!t.error) {
            translated = t.translated || null;
            romanji = t.romanji || null;
          }
        } catch (e) {
          console.warn('Translate failed:', e);
        }
      }

      thread.messages.push({
        role: 'assistant',
        content: assistantText,
        translation: translated,
        romanji: romanji,
        meta: response.data?.model ? 'Model: ' + response.data.model : undefined,
        voiceable: inputMode !== 'vi' && isJapaneseText(assistantText)
      });

      updateThreadMeta(thread);
      saveThreads();
      renderAll();
      showToast('Hoàn thành');
    } catch (err) {
      dailyState.used = Math.max(0, Number(dailyState.used || 1) - 1);
      saveDaily();
      updateDailyUi();
      removeTyping();
      thread.messages.push({
        role: 'assistant',
        content: 'Lỗi network/khác: ' + (err?.message || String(err)),
        voiceable: false
      });
      updateThreadMeta(thread);
      saveThreads();
      renderAll();
    } finally {
      removeTyping();
      sendBtn.disabled = false;
    }
  }

  document.addEventListener('click', (e) => {
    if (window.innerWidth <= 900 && sidebar.classList.contains('open')) {
      const clickedInsideSidebar = sidebar.contains(e.target) || mobileMenuBtn.contains(e.target);
      if (!clickedInsideSidebar) sidebar.classList.remove('open');
    }
  });

  console.log('Multi-chat client initialized.');
});
</script>
